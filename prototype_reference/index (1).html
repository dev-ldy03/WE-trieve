function onlineView(){let list=results.map((r,n)=>({...r,n})).filter(r=>(filterChannel==='전체'||filterChannel===r.source)&&!excluded.has(selected+'-'+r.n));return `<div class="investigation-pad"><div class="row"><h3>비슷한 게시물 ${list.length}건</h3><span class="pill">AI 탐색 결과 예시</span></div><p class="small muted">${esc(searchCase.feature)} · 동선 주변</p><div class="search-sources">탐색 완료 <strong>5개 채널</strong><br>LOST112 · 지하철 · 버스 · 당근 · 중고나라</div><div class="selection">${['전체','LOST112','지하철','버스','당근','중고나라'].map(x=>`<button class="chip ${filterChannel===x?'active':''}" onclick="filterChannel='${x}';render()">${x}</button>`).join('')}</div>${list.map(r=>`<button class="online-result" onclick="resultDetail(${r.n})"><div class="row"><span class="small muted">${r.source} · ${searchCase.date.slice(5)} ${r.time}</span>${savedResults.has(selected+'-'+r.n)?'<span class="pill">확인 후보</span>':''}</div><div class="row" style="margin-top:12px">${art(item().type,'mini-art')}<div><strong>${item().type==='buds'?r.title:esc(item().name)+' 관련 습득물 예시'}</strong><p class="small muted">${r.place}</p></div></div><p class="match-reason">${icon('spark',13)} ${r.why}</p></button>`).join('')}${!list.length?'<div class="empty">남은 후보가 없어요.</div>':''}<button class="text-next" onclick="excluded.clear();render()">제외한 게시물 다시 보기</button><div class="card"><strong>검색하는 동안 신고·문의도 진행해요</strong><p class="small muted">게시물이 아직 올라오지 않았을 수 있어요.</p><button class="btn secondary full" onclick="findTab='contact';render()">동선 주변 문의처 확인</button></div><p class="note">사진·게시물·일치 근거는 모두 가상 예시입니다. 실제 검색 결과나 소유권 판정이 아닙니다.</p></div>`}
function resultDetail(n){let r=results[n];modal(`<span class="pill">${r.source} · 가상 게시물</span><h3 style="margin-top:12px">${item().type==='buds'?r.title:esc(item().name)+' 습득물 예시'}</h3><div class="comparison"><div>${art(item().type,'mini-art')}<strong>내 물건</strong><p>${esc(searchCase.feature)}</p></div><div>${art(item().type,'mini-art')}<strong>게시물 속 물건</strong><p>${r.features}</p></div></div><div class="card"><strong>왜 비슷하다고 봤나요?</strong><p class="small muted">${r.why}</p><p class="small">습득·게시 시간 ${r.time}<br>장소 ${r.place}</p></div><button class="btn full" onclick="savedResults.add(selected+'-'+${n});closeModal();${r.contact!==null?'contactIndex='+r.contact+';findTab=\'contact\';':''}render();toast('확인할 후보로 저장했어요.')">비슷해요 · ${r.contact!==null?'보관처 문의':'후보로 저장'}</button><button class="btn ghost full" onclick="excluded.add(selected+'-'+${n});closeModal();render()">내 물건이 아니에요</button><button class="text-next" onclick="originalPost(${n})">원문 내용 보기 ${icon('arrow',14)}</button>`)}
function originalPost(n){let r=results[n];modal(`<span class="pill">원문 미리보기 · 가상</span><h3 style="margin-top:12px">${r.title}</h3><p style="margin-top:15px">${searchCase.date} ${r.time}, ${r.place}에 등록된 게시물입니다.</p><p>특징: ${r.features}</p><p class="note">실제 서비스에서는 출처 사이트의 원문으로 이동합니다. 이 화면은 외부 사이트를 열지 않습니다.</p><button class="btn full" onclick="resultDetail(${n})">비교 화면으로 돌아가기</button>`)}
const contacts=[
 ['도서관 안내 데스크','09:00–21:00','02-0000-0001','2층 열람실·안내 데스크'],

 ['신촌역 유실물 담당','09:00–18:00','02-0000-0004','역무실·대합실'],
 ['택시 탑승 문의','09:00–18:00','02-0000-0005','카카오T · 서울 00바 0000']

function contactView(){let c=contacts[contactIndex];return `${sceneMap(true)}<div class="investigation-pad"><h3>동선 위 문의처</h3><p class="small muted">지도 번호를 누르면 해당 문의처가 바뀌어요.</p><div class="selection">${visibleJourney().map(p=>`<button class="chip ${contactIndex===p.index?'active':''}" onclick="contactIndex=${p.index};render()">${p.index+1}. ${p.name}</button>`).join('')}</div><div class="selected-stop"><div class="row"><strong>${c[0]}</strong><span class="pill">연락처 예시</span></div><p>${c[3]}</p><dl class="contact-info"><dt>운영시간</dt><dd>${c[1]}</dd><dt>전화번호</dt><dd>${c[2]}</dd></dl><div class="actions"><button class="btn" onclick="callPlace()">전화 문의</button><button class="btn secondary" onclick="contactScript(${contactIndex})">문의 내용 보기</button></div><label for="contact-status">문의 결과</label><select id="contact-status" onchange="contactNotes[contactIndex]=this.value;render()">${['아직 문의 전','부재중 · 다시 문의','접수된 물건 없음','비슷한 물건 있음'].map(t=>`<option ${contactNotes[contactIndex]===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="section"><h3>온라인 분실 신고</h3><p class="small muted">탐색과 별개로 신고를 남겨둘 수 있어요.</p></div>${['LOST112','지하철 분실 신고'].map(x=>`<button class="report-channel" onclick="reportChannel='${x}';reportStep=0;reportGuide()"><div><strong>${x}</strong><p>절차 확인 → 정보 준비 → 접수 기록</p></div>${icon('arrow',16)}</button>`).join('')}${reports.length?`<div class="card"><strong>내 신고 기록</strong>${reports.map(r=>`<p class="small">${r} · DEMO-${reports.indexOf(r)+1} · 시연 접수</p>`).join('')}</div>`:''}<p class="note">기관명·운영시간·전화번호는 화면 구성을 위한 예시입니다. 실제 통화·신고·지도 연동은 하지 않습니다.</p><button class="text-next" onclick="go('support')">찾지 못했을 때 · 재구매 지원 확인 ${icon('arrow',14)}</button></div>`}
function callPlace(){modal(`<h3>${contacts[contactIndex][0]}</h3><div class="price" style="margin-top:16px;font-size:24px">${contacts[contactIndex][2]}</div><p class="small muted">운영시간 ${contacts[contactIndex][1]}</p><p class="note">가상 번호입니다. 실제 전화는 걸지 않습니다.</p><button class="btn full" onclick="closeModal();contactNotes[contactIndex]='부재중 · 다시 문의';render()">부재중으로 기록</button><button class="btn secondary full" onclick="closeModal();contactNotes[contactIndex]='접수된 물건 없음';render()">물건 없음으로 기록</button><button class="btn ghost full" onclick="closeModal();contactNotes[contactIndex]='비슷한 물건 있음';render()">비슷한 물건 있음</button>`)}
function contactScript(n){modal(`<h3>문의할 내용</h3><div class="card"><p>안녕하세요. ${searchCase.date} ${journey[n].time}에 ${journey[n].name}을 이용한 뒤 ${esc(item().name)}을 찾지 못하고 있습니다.</p><p>특징은 ${esc(searchCase.feature)}입니다. 비슷한 물건이 접수됐는지 확인 부탁드립니다.</p></div><p class="note">현재 선택한 물건·시간·장소가 반영된 문구입니다.</p><button class="btn full" onclick="closeModal()">확인했어요</button>`)}
let reportChannel='LOST112';
function reportGuide(){if(reportStep===0)modal(`<span class="pill">1 / 3 · 절차 안내</span><h3 style="margin-top:12px">${reportChannel}에 신고하기</h3><ol class="report-steps"><li>신고 사이트에서 본인 확인</li><li>분실 물건·일시·장소 입력</li><li>특징과 사진 등록</li><li>접수번호 보관</li></ol><p class="note">시연용 절차이며 실제 사이트의 요구사항은 연동 시 확인합니다.</p><button class="btn full" onclick="reportStep=1;reportGuide()">신고 정보 준비</button>`);else if(reportStep===1)modal(`<span class="pill">2 / 3 · 신고 정보</span><h3 style="margin-top:12px">기억한 내용을 모았어요</h3><div class="card"><p>물건: ${esc(item().name)}<br>날짜: ${searchCase.date}<br>분실 추정 시간: ${searchCase.from}–${searchCase.to}<br>장소: ${journey[contactIndex].name}<br>특징: ${esc(searchCase.feature)}</p></div><p class="small muted">실제 서비스에서는 이 정보를 확인한 후 신고 사이트로 이동해 직접 등록해요.</p><button class="btn full" onclick="reportStep=2;reportGuide()">신고 사이트 이동 체험</button>`);else modal(`<span class="pill">3 / 3 · 접수 기록</span><h3 style="margin-top:12px">신고를 마쳤나요?</h3><p style="margin-top:12px">외부 신고 사이트에서 접수한 뒤 이 화면으로 돌아와 접수번호와 처리 내역을 기록해요.</p><p class="note">현재는 외부 전송 없이 예시 접수번호를 저장합니다.</p><button class="btn full" onclick="reports.push(reportChannel);closeModal();render()">시연 접수 기록 저장</button>`)}

function support(){if(supportTab==='history')return supportHistory();return `<h2>재구매 지원</h2>${supportTabs()}<p class="muted small">등록한 물건의 지원 내용을 확인하세요.</p><div class="plan"><div class="row"><strong>내 물건 안심 플랜</strong><span class="pill">예시 플랜</span></div><div class="price">3,000원 <span class="muted">/ 월 · 물건 1개 기준</span></div><div style="border-top:1px solid #ffffff25;padding-top:14px;font-size:13px">10만 원 물건 · 최대 7만 원 지원</div><p>분실 확인 후 재구매 비용 일부를 지원해요.</p></div><div class="row section"><h3>지원받을 물건</h3><button onclick="go('bundle')">함께 묶기 ${icon('plus',14)}</button></div>${items.filter(i=>i.protected).map(i=>`<div class="card row">${art(i.type,'mini-art')}<div style="flex:1"><strong>${esc(i.name)}</strong><p class="small muted">재구매 지원 대상</p></div><span class="pill">등록됨</span></div>`).join('')}<button class="btn full" onclick="go('claim')">분실 후 지원 신청 ${icon('arrow',16)}</button>${claim?'<button class="btn ghost full" onclick="go(\'status\')">내 신청 내역 보기</button>':''}<div class="card"><strong>이렇게 진행돼요</strong><p class="small muted" style="line-height:2">01 물건과 분실 상황을 알려주세요.<br>02 등록 정보와 분실 기록을 확인해요.<br>03 확인이 끝나면 재구매를 도와드려요.</p></div><p class="note">화면의 가격·지원 한도는 시연용 예시입니다.</p>`}
function supportTabs(){return `<div class="find-tabs support-tabs">${[['new','새 신청'],['history','신청 내역']].map(([id,t])=>`<button class="${supportTab===id?'active':''}" onclick="supportTab='${id}';render()">${t}</button>`).join('')}</div>`}
function supportHistory(){return `<h2>재구매 지원</h2>${supportTabs()}${claim?`<button class="card" style="width:100%;text-align:left" onclick="go('status')"><div class="row"><strong>${esc(claim.name)}</strong><span class="pill">작성 완료</span></div><p class="small muted">${esc(claim.date)} · 예시 신청</p><div class="text-next">상세 보기 ${icon('arrow',14)}</div></button>`:`<div class="empty">${icon('file',32)}<h3 style="margin-top:15px">아직 신청 내역이 없어요</h3><p class="small muted">새 신청에서 분실 내용을 작성할 수 있어요.</p><button class="btn" onclick="supportTab='new';render()">새 신청하기</button></div>`}`}

function bundlePage(){return `<button class="back" onclick="go('support')">${icon('back',16)} 재구매 지원</button><h2>지원받을 물건 선택</h2><p class="muted small">자주 가지고 다니는 물건을 골라주세요.</p><div class="card">${items.map(i=>`<button class="line-item row" style="width:100%;text-align:left" onclick="toggleBundle(${i.id})">${art(i.type,'mini-art')}<strong style="flex:1">${esc(i.name)}</strong><span class="circlecheck ${bundle.has(i.id)?'selected':''}">${bundle.has(i.id)?icon('check',15):''}</span></button>`).join('')}</div><div class="card row"><span>선택한 물건</span><strong>${bundle.size}개</strong></div><p class="note">여러 물건을 함께 등록하는 화면입니다. 묶음 가격과 지원 조건은 추후 안내됩니다.</p><button class="btn full" onclick="saveBundle()">선택한 물건 저장</button>`}
function claimPage(){return `<button class="back" onclick="go('support')">${icon('back',16)} 재구매 지원</button><h2>분실 지원 신청</h2><p class="muted small">확인에 필요한 내용을 알려주세요.</p><div class="step"><b>1</b> 분실 내용 <span>────</span><span>2 확인 및 접수</span></div><form id="claim-form" onsubmit="reviewClaim(event)"><label for="claim-item">잃어버린 물건</label><select id="claim-item" required>${items.filter(i=>i.protected).map(i=>`<option value="${i.id}" ${i.id===selected?'selected':''}>${esc(i.name)}</option>`).join('')}</select><label for="lost-date">분실을 알아챈 날짜</label><input type="date" id="lost-date" value="2026-11-02" required><label for="lost-place">마지막으로 기억하는 장소</label><input id="lost-place" placeholder="예: 도서관 2층 열람실" required maxlength="100"><label for="lost-story">분실 상황과 찾아본 방법</label><textarea id="lost-story" placeholder="마지막으로 사용한 때와 찾아본 곳을 알려주세요." required maxlength="1000"></textarea><label for="evidence">관련 자료 <span class="muted">(선택)</span></label><input type="file" id="evidence" accept="image/*,.pdf"><p class="note">물건 사진이나 구매 내역을 첨부할 수 있어요.<br>시연 화면이므로 실제 개인정보·증빙 대신 예시 자료를 사용해주세요. 파일은 전송되지 않습니다.</p><button class="btn full" type="submit">입력 내용 확인 ${icon('arrow',16)}</button></form>`}
function status(){return `<div class="success">${icon('check',30)}</div><h2 class="center">신청 내용을 저장했어요</h2><p class="muted small center">실제 접수 전 흐름을 보여주는 시연 화면이에요.</p><div class="card"><div class="row"><strong>${esc(claim?.name||'에어팟')}</strong><span class="pill">접수 예시</span></div><p class="small muted">분실 확인일 · ${esc(claim?.date||'2026-11-02')}</p></div><div class="card"><h3>신청 진행 상태</h3><div class="timeline"><div><strong>신청 내용 작성 완료</strong><p>입력한 내용을 확인했어요.</p></div><div><strong class="muted">분실 내용 확인</strong><p>실제 서비스에서는 기록과 자료를 검토해요.</p></div><div><strong class="muted">결과 안내</strong><p>검토 후 지원 가능 여부를 알려드려요.</p></div></div></div><button class="btn full" onclick="go('home')">내 물건으로 돌아가기</button>`}
function my(){return `<h2>나의 Wetriever</h2><p class="muted small">물건, 알림, 지원 내역을 관리하세요.</p><div class="card row"><div class="badge" style="background:var(--mint);color:var(--green)">${icon('user')}</div><div style="flex:1"><strong>방문자님</strong><p class="small muted">등록한 물건 ${items.length}개</p></div></div><div class="card"><button class="menu" onclick="go('home')">${icon('home')}<span>내 물건 관리</span>${icon('arrow',16)}</button><button class="menu" onclick="go('support')">${icon('shield')}<span>재구매 지원</span>${icon('arrow',16)}</button><button class="menu" onclick="${claim?"go('status')":"toast('아직 작성한 신청이 없어요.')"}">${icon('file')}<span>지원 신청 내역</span>${icon('arrow',16)}</button><div class="menu">${icon('bell')}<span>분실 예방 알림</span><button class="toggle ${notify?'on':''}" role="switch" aria-label="분실 예방 알림" aria-checked="${notify}" onclick="notify=!notify;render()"></button></div></div><p class="note">프로토타입 안내<br>모든 위치·연결 상태·AI 추천은 예시입니다. 기기 연결이나 실제 지원 접수는 이루어지지 않으며, 입력한 내용은 이 화면을 새로고침하면 초기화됩니다.</p>`}
function alerts(){return `<button class="back" onclick="go('home')">${icon('back',16)} 홈</button><h2>알림</h2><p class="small muted">내 물건의 새로운 소식이에요.</p><button class="card notification" style="width:100%;text-align:left" onclick="go('detail',2)"><div class="row"><strong>에어팟, 챙기셨나요?</strong><span class="small muted">24분 전</span></div><p class="small muted">서강대 도서관에서 마지막으로 감지됐어요.</p><div style="margin-top:12px;color:var(--green);font-size:12px">마지막 위치 확인 ${icon('arrow',14)}</div></button>`}
function render(){const screens={home,detail,find,support,bundle:bundlePage,claim:claimPage,status,my,alerts};$('#content').classList.toggle('find-mode',view==='find');$('#content').innerHTML=(screens[view]||home)();$('#nav').innerHTML=[['home','home','홈'],['find','search','찾기'],['support','shield','재구매 지원'],['my','user','마이']].map(([v,i,t])=>`<button class="${(view===v||(v==='home'&&['detail','alerts'].includes(view))||(v==='support'&&['bundle','claim','status'].includes(view)))?'active':''}" onclick="go('${v}')">${icon(i)}${t}</button>`).join('');$('#notification-button').innerHTML=icon('bell')+'<span class="dot"></span>'}
function toast(t){$('#message').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#message').innerHTML='',3500)}
function modal(html){$('#overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modal-box" role="dialog" aria-modal="true" aria-label="안내"><div class="row" style="justify-content:flex-end"><button aria-label="닫기" onclick="closeModal()">${icon('close')}</button></div>${html}</section></div>`;$('#overlay button')?.focus()}
function closeModal(){$('#overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function ring(){if(!item().near){modal(`<div class="center"><div class="success">${icon('sound',28)}</div><h3>아직 연결되지 않았어요</h3><p class="muted small" style="margin-top:10px">마지막 감지 장소로 이동한 뒤<br>가까워지면 소리로 찾을 수 있어요.</p><button class="btn full" onclick="closeModal();go('find')">찾아볼 장소 확인</button></div>`)}else{modal(`<div class="center"><div class="success">${icon('sound',28)}</div><h3>${esc(item().name)}의 소리를 따라가요</h3><p class="muted small" style="margin-top:10px">소리로 찾기 시연 화면입니다.<br>실제 기기에서는 소리가 울리지 않아요.</p><button class="btn full" onclick="closeModal();toast('다행이에요. 물건을 찾았어요!')">찾았어요</button><button class="btn ghost full" onclick="closeModal()">찾기 중지</button></div>`)}}
function checkPlace(n){let k=selected+'-'+n;checked.has(k)?checked.delete(k):checked.add(k);render()}
function toggleBundle(id){bundle.has(id)?bundle.delete(id):bundle.add(id);render()}
function saveBundle(){if(!bundle.size)return toast('물건을 하나 이상 선택해주세요.');items.forEach(i=>i.protected=bundle.has(i.id));go('support');toast('선택한 물건을 저장했어요. (시연)')}
function addModal(){modal(`<h3>물건 등록</h3><form onsubmit="addItem(event)"><label for="new-name">물건 이름</label><input id="new-name" placeholder="예: 매일 쓰는 헤드폰" required maxlength="20"><label for="new-type">물건 종류</label><select id="new-type"><option value="wallet">지갑</option><option value="buds">이어폰</option><option value="keys">열쇠</option><option value="charger">충전기</option></select><p class="note">기기 연결 없이 물건 등록 화면을 체험해요.</p><button class="btn full" type="submit">물건 등록하기</button></form>`)}
function addItem(e){e.preventDefault();const name=$('#new-name').value.trim();if(!name)return toast('물건 이름을 입력해주세요.');items.push({id:Date.now(),name,type:$('#new-type').value,near:true,place:'내 주변',time:'방금',protected:false});closeModal();go('home');toast('새 물건을 등록했어요. (시연)')}
function reviewClaim(e){e.preventDefault();const id=Number($('#claim-item').value);const name=items.find(i=>i.id===id)?.name;const place=$('#lost-place').value.trim(),story=$('#lost-story').value.trim();if(!place||!story)return toast('장소와 분실 상황을 입력해주세요.');const date=$('#lost-date').value;const file=$('#evidence').files[0]?.name||'첨부 없음';window.draft={name,date,place,story,file};modal(`<h3>신청 내용을 확인해주세요</h3><div class="card"><strong>${esc(name)}</strong><p class="small muted">${esc(date)} · ${esc(place)}</p><p class="small" style="white-space:pre-wrap">${esc(story)}</p><p class="note">첨부 · ${esc(file)}</p></div><p class="note">입력 내용은 외부로 전송되지 않습니다. 다음 화면에서 접수 후 진행 상태를 확인할 수 있어요.</p><button class="btn full" onclick="claim=window.draft;closeModal();go('status')">시연 신청 완료</button>`)}
render();
</script></body></html>
